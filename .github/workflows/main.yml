name: PC Virtual Windows V3

on:
  workflow_dispatch:

jobs:
  windows-pc:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:

      - name: Marcar inicio do PC
        shell: powershell
        run: |

          $Inicio = Get-Date
          $Fim = $Inicio.AddMinutes(360)

          Set-Content `
            -Path "C:\ProgramData\CloudPC-EndTime.txt" `
            -Value $Fim.ToString("o") `
            -Encoding UTF8

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "INICIO DO CLOUD PC"
          Write-Host "Inicio: $Inicio"
          Write-Host "Fim previsto: $Fim"
          Write-Host "Duracao: 360 minutos"
          Write-Host "=========================================="

      - name: Ativar RDP e Audio
        shell: powershell
        run: |

          Write-Host "Configurando RDP..."

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue

          Set-Service `
            -Name "TermService" `
            -StartupType Automatic

          Start-Service `
            -Name "TermService" `
            -ErrorAction SilentlyContinue

          Write-Host "Configurando audio..."

          Set-Service `
            -Name "Audiosrv" `
            -StartupType Automatic `
            -ErrorAction SilentlyContinue

          Set-Service `
            -Name "AudioEndpointBuilder" `
            -StartupType Automatic `
            -ErrorAction SilentlyContinue

          Start-Service `
            -Name "AudioEndpointBuilder" `
            -ErrorAction SilentlyContinue

          Start-Service `
            -Name "Audiosrv" `
            -ErrorAction SilentlyContinue

          $Policy = "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services"

          if (-not (Test-Path $Policy)) {
            New-Item `
              -Path $Policy `
              -Force | Out-Null
          }

          Set-ItemProperty `
            -Path $Policy `
            -Name "fDisableAudio" `
            -Type DWord `
            -Value 0

          Set-ItemProperty `
            -Path $Policy `
            -Name "fDisableAudioCapture" `
            -Type DWord `
            -Value 0

          Write-Host "RDP e audio configurados."

      - name: Criar CloudPC
        shell: powershell
        run: |

          Write-Host "Criando usuario CloudPC..."

          $Username = "CloudPC"

          $Upper = "ABCDEFGHJKLMNPQRSTUVWXYZ".ToCharArray()
          $Lower = "abcdefghijkmnopqrstuvwxyz".ToCharArray()
          $Numbers = "23456789".ToCharArray()
          $Special = "!@#$%&*".ToCharArray()

          $AllChars = @(
            $Upper
            $Lower
            $Numbers
            $Special
          )

          $PasswordChars = @()

          $PasswordChars += ($Upper | Get-Random)
          $PasswordChars += ($Lower | Get-Random)
          $PasswordChars += ($Numbers | Get-Random)
          $PasswordChars += ($Special | Get-Random)

          1..16 | ForEach-Object {
            $PasswordChars += ($AllChars | Get-Random)
          }

          $Password = -join (
            $PasswordChars | Get-Random -Count $PasswordChars.Count
          )

          $SecurePassword = ConvertTo-SecureString `
            $Password `
            -AsPlainText `
            -Force

          $User = Get-LocalUser `
            -Name $Username `
            -ErrorAction SilentlyContinue

          if ($User) {

            Set-LocalUser `
              -Name $Username `
              -Password $SecurePassword

          }
          else {

            New-LocalUser `
              -Name $Username `
              -Password $SecurePassword `
              -FullName "Cloud PC" `
              -Description "Cloud PC RDP User" `
              -PasswordNeverExpires

          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $Username `
            -ErrorAction SilentlyContinue

          "CLOUDPC_PASSWORD=$Password" >> $env:GITHUB_ENV

          Write-Host ""
          Write-Host "Usuario criado: CloudPC"
          Write-Host "Senha gerada com sucesso."

      - name: Instalar Tailscale
        shell: powershell
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}

        run: |

          Write-Host "Verificando Auth Key..."

          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) {

            Write-Error "O Secret TS_AUTHKEY nao existe ou esta vazio."
            exit 1

          }

          $Installer = "$env:TEMP\tailscale-setup.exe"

          Write-Host "Baixando Tailscale..."

          try {

            Invoke-WebRequest `
              -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" `
              -OutFile $Installer `
              -UseBasicParsing

          }
          catch {

            Write-Error "Falha ao baixar o Tailscale."
            exit 1

          }

          Write-Host "Instalando Tailscale..."

          Start-Process `
            -FilePath $Installer `
            -ArgumentList "/quiet" `
            -Wait

          Start-Sleep -Seconds 8

          $Tailscale = "C:\Program Files\Tailscale\tailscale.exe"

          if (-not (Test-Path $Tailscale)) {

            Write-Error "Tailscale nao foi instalado."
            exit 1

          }

          Write-Host "Tailscale encontrado."
          Write-Host "Conectando..."

          & $Tailscale up `
            --authkey="$env:TS_AUTHKEY" `
            --hostname="github-cloud-pc-v3"

          if ($LASTEXITCODE -ne 0) {

            Write-Error ""
            Write-Error "=========================================="
            Write-Error "FALHA NO TAILSCALE"
            Write-Error "=========================================="
            Write-Error ""
            Write-Error "A Auth Key TS_AUTHKEY foi rejeitada."
            Write-Error "Crie uma nova Auth Key no Tailscale."
            Write-Error "Depois atualize o Secret TS_AUTHKEY no GitHub."
            Write-Error ""
            Write-Error "O workflow foi interrompido."
            Write-Error "=========================================="

            exit 1
          }

          Start-Sleep -Seconds 10

          $IP = & $Tailscale ip -4

          if ([string]::IsNullOrWhiteSpace($IP)) {

            Write-Error "Tailscale conectou, mas nao recebeu um IP."
            exit 1

          }

          Set-Service `
            -Name "Tailscale" `
            -StartupType Automatic `
            -ErrorAction SilentlyContinue

          Start-Service `
            -Name "Tailscale" `
            -ErrorAction SilentlyContinue

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "TAILSCALE CONECTADO"
          Write-Host "IP: $IP"
          Write-Host "=========================================="

      - name: Criar Auto Recovery
        shell: powershell
        run: |

          $Recovery = "C:\ProgramData\CloudPC-Recovery.ps1"

          $Lines = @(
            'Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0 -ErrorAction SilentlyContinue'
            'Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 1 -ErrorAction SilentlyContinue'
            'Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue'
            'Set-Service -Name "TermService" -StartupType Automatic -ErrorAction SilentlyContinue'
            'Start-Service -Name "TermService" -ErrorAction SilentlyContinue'
            'Set-Service -Name "AudioEndpointBuilder" -StartupType Automatic -ErrorAction SilentlyContinue'
            'Set-Service -Name "Audiosrv" -StartupType Automatic -ErrorAction SilentlyContinue'
            'Start-Service -Name "AudioEndpointBuilder" -ErrorAction SilentlyContinue'
            'Start-Service -Name "Audiosrv" -ErrorAction SilentlyContinue'
            'Start-Service -Name "Tailscale" -ErrorAction SilentlyContinue'
          )

          Set-Content `
            -Path $Recovery `
            -Value $Lines `
            -Encoding UTF8

          $Action = New-ScheduledTaskAction `
            -Execute "powershell.exe" `
            -Argument "-NoProfile -ExecutionPolicy Bypass -File `"$Recovery`""

          $Trigger = New-ScheduledTaskTrigger `
            -AtStartup

          $Principal = New-ScheduledTaskPrincipal `
            -UserId "SYSTEM" `
            -LogonType ServiceAccount `
            -RunLevel Highest

          Register-ScheduledTask `
            -TaskName "CloudPC-AutoRecovery" `
            -Action $Action `
            -Trigger $Trigger `
            -Principal $Principal `
            -Force

          Write-Host "Auto Recovery criado."

      - name: Modo desempenho
        shell: powershell
        run: |

          Write-Host "Ativando modo desempenho..."

          powercfg /setactive SCHEME_MIN

          $Visual = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects"

          New-Item `
            -Path $Visual `
            -Force | Out-Null

          Set-ItemProperty `
            -Path $Visual `
            -Name "VisualFXSetting" `
            -Type DWord `
            -Value 2

          $Personalize = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize"

          Set-ItemProperty `
            -Path $Personalize `
            -Name "EnableTransparency" `
            -Type DWord `
            -Value 0 `
            -ErrorAction SilentlyContinue

          Write-Host "Modo desempenho ativado."

      - name: Preparar Roblox Studio
        shell: powershell
        run: |

          Write-Host "Preparando Roblox Studio..."

          New-Item `
            -Path "C:\CloudPC\RobloxProjects" `
            -ItemType Directory `
            -Force | Out-Null

          New-Item `
            -Path "C:\CloudPC\Tools" `
            -ItemType Directory `
            -Force | Out-Null

          Write-Host "Pasta RobloxProjects criada."

          $Apps = @(
            "RobloxStudioBeta",
            "RobloxPlayerBeta"
          )

          foreach ($App in $Apps) {

            Get-Process `
              -Name $App `
              -ErrorAction SilentlyContinue |
              ForEach-Object {

                try {

                  $_.PriorityClass = "AboveNormal"

                }
                catch {}

              }
          }

          Write-Host "Roblox Studio preparado."

      - name: Configurar redirecionamento
        shell: powershell
        run: |

          $RDP = "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services"

          if (-not (Test-Path $RDP)) {

            New-Item `
              -Path $RDP `
              -Force | Out-Null

          }

          Set-ItemProperty `
            -Path $RDP `
            -Name "fDisableAudio" `
            -Type DWord `
            -Value 0

          Set-ItemProperty `
            -Path $RDP `
            -Name "fDisableAudioCapture" `
            -Type DWord `
            -Value 0

          Set-ItemProperty `
            -Path $RDP `
            -Name "fDisableClip" `
            -Type DWord `
            -Value 0

          Write-Host "Audio configurado."

          Write-Host "Clipboard configurado."

      - name: Diagnostico
        shell: powershell
        run: |

          $Computer = Get-CimInstance Win32_ComputerSystem
          $OS = Get-CimInstance Win32_OperatingSystem

          $RAMTotal = [math]::Round(
            $Computer.TotalPhysicalMemory / 1GB,
            2
          )

          $RAMLivre = [math]::Round(
            $OS.FreePhysicalMemory / 1MB,
            2
          )

          $Tailscale = "C:\Program Files\Tailscale\tailscale.exe"

          $IP = "Indisponivel"

          if (Test-Path $Tailscale) {

            $IP = & $Tailscale ip -4

          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "             DIAGNOSTICO"
          Write-Host "=========================================="
          Write-Host ""
          Write-Host "Sistema: $($OS.Caption)"
          Write-Host "RAM total: $RAMTotal GB"
          Write-Host "RAM livre: $RAMLivre GB"
          Write-Host ""
          Write-Host "RDP: $((Get-Service TermService).Status)"
          Write-Host "Audio: $((Get-Service Audiosrv).Status)"
          Write-Host "Tailscale: $((Get-Service Tailscale).Status)"
          Write-Host "IP Tailscale: $IP"
          Write-Host ""
          Write-Host "=========================================="

      - name: Mostrar dados
        shell: powershell
        run: |

          Start-Sleep -Seconds 5

          $Tailscale = "C:\Program Files\Tailscale\tailscale.exe"

          if (-not (Test-Path $Tailscale)) {

            Write-Error "Tailscale nao encontrado."
            exit 1

          }

          $IP = & $Tailscale ip -4

          if ([string]::IsNullOrWhiteSpace($IP)) {

            Write-Error "Nao foi possivel obter o IP do Tailscale."
            exit 1

          }

          $Fim = Get-Content `
            -Path "C:\ProgramData\CloudPC-EndTime.txt"

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "          CLOUD PC ONLINE"
          Write-Host "=========================================="
          Write-Host ""
          Write-Host "IP Tailscale:"
          Write-Host "$IP"
          Write-Host ""
          Write-Host "Usuario:"
          Write-Host "CloudPC"
          Write-Host ""
          Write-Host "Senha:"
          Write-Host "$env:CLOUDPC_PASSWORD"
          Write-Host ""
          Write-Host "RDP: OK"
          Write-Host "Tailscale: OK"
          Write-Host "Audio: OK"
          Write-Host "Auto Recovery: OK"
          Write-Host "Desempenho: OK"
          Write-Host ""
          Write-Host "Fim previsto:"
          Write-Host "$Fim"
          Write-Host ""
          Write-Host "Duracao maxima: 360 minutos"
          Write-Host ""
          Write-Host "=========================================="

      - name: Monitorar PC
        shell: powershell
        run: |

          $FimTexto = Get-Content `
            -Path "C:\ProgramData\CloudPC-EndTime.txt"

          $Limite = [DateTime]::Parse($FimTexto)

          while ($true) {

            $Agora = Get-Date

            $Restante = $Limite - $Agora

            if ($Restante.TotalSeconds -le 0) {

              Write-Host ""
              Write-Host "=========================================="
              Write-Host "TEMPO MAXIMO ATINGIDO"
              Write-Host "=========================================="

              break

            }

            try {

              $CPU = (
                Get-Counter `
                  '\Processor(_Total)\% Processor Time'
              ).CounterSamples.CookedValue

              $CPU = [math]::Round(
                $CPU,
                1
              )

            }
            catch {

              $CPU = "N/A"

            }

            try {

              $OS = Get-CimInstance `
                Win32_OperatingSystem

              $TotalRAM = $OS.TotalVisibleMemorySize
              $FreeRAM = $OS.FreePhysicalMemory

              $RAM = 100 - (
                ($FreeRAM / $TotalRAM) * 100
              )

              $RAM = [math]::Round(
                $RAM,
                1
              )

            }
            catch {

              $RAM = "N/A"

            }

            $Horas = [math]::Floor(
              $Restante.TotalHours
            )

            $Minutos = $Restante.Minutes
            $Segundos = $Restante.Seconds

            Write-Host ""
            Write-Host "=========================================="
            Write-Host "$(Get-Date)"
            Write-Host "PC ONLINE"
            Write-Host "CPU: $CPU %"
            Write-Host "RAM: $RAM %"
            Write-Host "Tempo restante: ${Horas}h ${Minutos}m ${Segundos}s"
            Write-Host "=========================================="

            Start-Sleep -Seconds 60

          }
