name: PC Virtual Windows - RDP

on:
  workflow_dispatch:

jobs:
  windows-pc:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:

      - name: Ativar RDP
        shell: powershell
        run: |
          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1

          Write-Host "RDP ativado."

      - name: Criar usuário CloudPC
        shell: powershell
        run: |
          $Username = "CloudPC"
          $Password = "Vx7!Qp9#Lm2@Rt6$Zk8%Ws4&"

          $SecurePassword = ConvertTo-SecureString `
            $Password `
            -AsPlainText `
            -Force

          $ExistingUser = Get-LocalUser `
            -Name $Username `
            -ErrorAction SilentlyContinue

          if ($ExistingUser) {

            Set-LocalUser `
              -Name $Username `
              -Password $SecurePassword

          } else {

            New-LocalUser `
              -Name $Username `
              -Password $SecurePassword `
              -FullName "Cloud PC User" `
              -Description "Cloud PC RDP User" `
              -PasswordNeverExpires

          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $Username `
            -ErrorAction SilentlyContinue

          Write-Host "Usuário CloudPC configurado."

      - name: Instalar Tailscale
        shell: powershell
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}

        run: |

          if (-not $env:TS_AUTHKEY) {
            Write-Error "TS_AUTHKEY não foi encontrado nos GitHub Secrets."
            exit 1
          }

          $Installer = "$env:TEMP\tailscale-setup.exe"

          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" `
            -OutFile $Installer

          Start-Process `
            -FilePath $Installer `
            -ArgumentList "/quiet" `
            -Wait

          Start-Sleep -Seconds 5

          $Tailscale = "C:\Program Files\Tailscale\tailscale.exe"

          if (-not (Test-Path $Tailscale)) {
            Write-Error "Tailscale não foi instalado corretamente."
            exit 1
          }

          & $Tailscale up `
            --authkey="$env:TS_AUTHKEY" `
            --hostname="github-cloud-pc"

          Start-Sleep -Seconds 5

          Write-Host "Tailscale conectado."

      - name: Mostrar dados do PC
        shell: powershell
        run: |

          Start-Sleep -Seconds 10

          $Tailscale = "C:\Program Files\Tailscale\tailscale.exe"

          $IP = & $Tailscale ip -4

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "          PC VIRTUAL ONLINE"
          Write-Host "=========================================="
          Write-Host ""
          Write-Host "IP Tailscale: $IP"
          Write-Host "Usuário: CloudPC"
          Write-Host "Senha: Vx7!Qp9#Lm2@Rt6$Zk8%Ws4&"
          Write-Host ""
          Write-Host "RDP: ATIVADO"
          Write-Host "Tailscale: CONECTADO"
          Write-Host "Duração máxima: 360 minutos"
          Write-Host ""
          Write-Host "=========================================="

      - name: Manter PC online
        shell: powershell
        run: |

          while ($true) {
            Write-Host "$(Get-Date) - PC ONLINE"
            Start-Sleep -Seconds 60
          }
