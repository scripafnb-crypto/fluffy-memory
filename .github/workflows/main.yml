name: PC Virtual Windows V4

on:
  workflow_dispatch:

jobs:
  windows-pc:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:

      # ==========================================
      # INICIO / CONTADOR
      # ==========================================

      - name: Marcar inicio
        shell: powershell
        run: |

          $Inicio = Get-Date
          $Fim = $Inicio.AddMinutes(360)

          Set-Content `
            -Path "C:\ProgramData\CloudPC-EndTime.txt" `
            -Value $Fim.ToString("o") `
            -Encoding UTF8

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "       CLOUD PC V4"
          Write-Host "=========================================="
          Write-Host "Inicio: $Inicio"
          Write-Host "Fim previsto: $Fim"
          Write-Host "Duracao: 360 minutos"
          Write-Host "=========================================="

      # ==========================================
      # RDP + AUDIO
      # ==========================================

      - name: Configurar RDP e Audio
        shell: powershell
        run: |

          Write-Host "Configurando RDP..."

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue

          Set-Service `
            -Name "TermService" `
            -StartupType Automatic

          Start-Service `
            -Name "TermService" `
            -ErrorAction SilentlyContinue

          Write-Host "Configurando audio..."

          Set-Service `
            -Name "AudioEndpointBuilder" `
            -StartupType Automatic `
            -ErrorAction SilentlyContinue

          Set-Service `
            -Name "Audiosrv" `
            -StartupType Automatic `
            -ErrorAction SilentlyContinue

          Start-Service `
            -Name "AudioEndpointBuilder" `
            -ErrorAction SilentlyContinue

          Start-Service `
            -Name "Audiosrv" `
            -ErrorAction SilentlyContinue

          $Policy = "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services"

          if (-not (Test-Path $Policy)) {
              New-Item -Path $Policy -Force | Out-Null
          }

          Set-ItemProperty `
            -Path $Policy `
            -Name "fDisableAudio" `
            -Type DWord `
            -Value 0

          Set-ItemProperty `
            -Path $Policy `
            -Name "fDisableAudioCapture" `
            -Type DWord `
            -Value 0

          Set-ItemProperty `
            -Path $Policy `
            -Name "fDisableClip" `
            -Type DWord `
            -Value 0

          Write-Host "RDP configurado."
          Write-Host "Audio configurado."
          Write-Host "Clipboard configurado."

      # ==========================================
      # USUARIO
      # ==========================================

      - name: Criar CloudPC
        shell: powershell
        run: |

          $Username = "CloudPC"

          Write-Host "Criando usuario..."

          $Upper = "ABCDEFGHJKLMNPQRSTUVWXYZ".ToCharArray()
          $Lower = "abcdefghijkmnopqrstuvwxyz".ToCharArray()
          $Numbers = "23456789".ToCharArray()
          $Special = "!@#$%&*".ToCharArray()

          $All = @(
            $Upper
            $Lower
            $Numbers
            $Special
          )

          $PasswordChars = @()

          $PasswordChars += ($Upper | Get-Random)
          $PasswordChars += ($Lower | Get-Random)
          $PasswordChars += ($Numbers | Get-Random)
          $PasswordChars += ($Special | Get-Random)

          1..16 | ForEach-Object {
              $PasswordChars += ($All | Get-Random)
          }

          $Password = -join (
              $PasswordChars | Get-Random -Count $PasswordChars.Count
          )

          $SecurePassword = ConvertTo-SecureString `
            $Password `
            -AsPlainText `
            -Force

          $User = Get-LocalUser `
            -Name $Username `
            -ErrorAction SilentlyContinue

          if ($User) {

              Set-LocalUser `
                -Name $Username `
                -Password $SecurePassword

          }
          else {

              New-LocalUser `
                -Name $Username `
                -Password $SecurePassword `
                -FullName "Cloud PC" `
                -Description "Cloud PC RDP User" `
                -PasswordNeverExpires

          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $Username `
            -ErrorAction SilentlyContinue

          "CLOUDPC_PASSWORD=$Password" >> $env:GITHUB_ENV

          Write-Host "Usuario: CloudPC"
          Write-Host "Senha gerada."

      # ==========================================
      # TAILSCALE
      # ==========================================

      - name: Instalar e conectar Tailscale
        shell: powershell
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}

        run: |

          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) {

              Write-Error "Secret TS_AUTHKEY nao configurado."
              exit 1
          }

          $Installer = "$env:TEMP\tailscale-setup.exe"

          Write-Host "Baixando Tailscale..."

          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" `
            -OutFile $Installer `
            -UseBasicParsing

          if (-not (Test-Path $Installer)) {

              Write-Error "Download do Tailscale falhou."
              exit 1
          }

          Write-Host "Instalando Tailscale..."

          Start-Process `
            -FilePath $Installer `
            -ArgumentList "/quiet" `
            -Wait

          Start-Sleep -Seconds 8

          $Tailscale = "C:\Program Files\Tailscale\tailscale.exe"

          if (-not (Test-Path $Tailscale)) {

              Write-Error "Tailscale nao foi instalado."
              exit 1
          }

          Write-Host "Conectando Tailscale..."

          & $Tailscale up `
            --authkey="$env:TS_AUTHKEY" `
            --hostname="cloud-pc-v4"

          if ($LASTEXITCODE -ne 0) {

              Write-Error ""
              Write-Error "=========================================="
              Write-Error "       ERRO NO TAILSCALE"
              Write-Error "=========================================="
              Write-Error ""
              Write-Error "A Auth Key foi rejeitada."
              Write-Error "Verifique o Secret TS_AUTHKEY."
              Write-Error ""
              Write-Error "O workflow foi interrompido."
              Write-Error "=========================================="

              exit 1
          }

          Start-Sleep -Seconds 10

          $IP = & $Tailscale ip -4

          if ([string]::IsNullOrWhiteSpace($IP)) {

              Write-Error "Tailscale nao recebeu um IP."
              exit 1
          }

          Set-Service `
            -Name "Tailscale" `
            -StartupType Automatic `
            -ErrorAction SilentlyContinue

          Start-Service `
            -Name "Tailscale" `
            -ErrorAction SilentlyContinue

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "       TAILSCALE CONECTADO"
          Write-Host "IP: $IP"
          Write-Host "=========================================="

      # ==========================================
      # AUTO RECOVERY
      # ==========================================

      - name: Criar Auto Recovery
        shell: powershell
        run: |

          $Recovery = "C:\ProgramData\CloudPC-Recovery.ps1"

          $Lines = @(
            'Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0 -ErrorAction SilentlyContinue'
            'Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 1 -ErrorAction SilentlyContinue'
            'Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue'
            'Set-Service -Name "TermService" -StartupType Automatic -ErrorAction SilentlyContinue'
            'Start-Service -Name "TermService" -ErrorAction SilentlyContinue'
            'Set-Service -Name "AudioEndpointBuilder" -StartupType Automatic -ErrorAction SilentlyContinue'
            'Set-Service -Name "Audiosrv" -StartupType Automatic -ErrorAction SilentlyContinue'
            'Start-Service -Name "AudioEndpointBuilder" -ErrorAction SilentlyContinue'
            'Start-Service -Name "Audiosrv" -ErrorAction SilentlyContinue'
            'Start-Service -Name "Tailscale" -ErrorAction SilentlyContinue'
          )

          Set-Content `
            -Path $Recovery `
            -Value $Lines `
            -Encoding UTF8

          $Action = New-ScheduledTaskAction `
            -Execute "powershell.exe" `
            -Argument "-NoProfile -ExecutionPolicy Bypass -File `"$Recovery`""

          $Trigger = New-ScheduledTaskTrigger `
            -AtStartup

          $Principal = New-ScheduledTaskPrincipal `
            -UserId "SYSTEM" `
            -LogonType ServiceAccount `
            -RunLevel Highest

          Register-ScheduledTask `
            -TaskName "CloudPC-AutoRecovery" `
            -Action $Action `
            -Trigger $Trigger `
            -Principal $Principal `
            -Force

          Write-Host "Auto Recovery criado."

      # ==========================================
      # DESEMPENHO
      # ==========================================

      - name: Ativar modo desempenho
        shell: powershell
        run: |

          powercfg /setactive SCHEME_MIN

          $Visual = `
            "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects"

          New-Item `
            -Path $Visual `
            -Force | Out-Null

          Set-ItemProperty `
            -Path $Visual `
            -Name "VisualFXSetting" `
            -Type DWord `
            -Value 2

          $Personalize = `
            "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize"

          Set-ItemProperty `
            -Path $Personalize `
            -Name "EnableTransparency" `
            -Type DWord `
            -Value 0 `
            -ErrorAction SilentlyContinue

          Write-Host "Modo desempenho ativado."

      # ==========================================
      # PASTAS
      # ==========================================

      - name: Preparar pastas
        shell: powershell
        run: |

          New-Item `
            -Path "C:\CloudPC" `
            -ItemType Directory `
            -Force | Out-Null

          New-Item `
            -Path "C:\CloudPC\RobloxProjects" `
            -ItemType Directory `
            -Force | Out-Null

          New-Item `
            -Path "C:\CloudPC\Games" `
            -ItemType Directory `
            -Force | Out-Null

          New-Item `
            -Path "C:\CloudPC\Downloads" `
            -ItemType Directory `
            -Force | Out-Null

          New-Item `
            -Path "C:\CloudPC\Tools" `
            -ItemType Directory `
            -Force | Out-Null

          Write-Host "Pastas criadas."

      # ==========================================
      # DIAGNOSTICO
      # ==========================================

      - name: Diagnostico
        shell: powershell
        run: |

          $Computer = Get-CimInstance Win32_ComputerSystem
          $OS = Get-CimInstance Win32_OperatingSystem

          $RAMTotal = [math]::Round(
            $Computer.TotalPhysicalMemory / 1GB,
            2
          )

          $RAMLivre = [math]::Round(
            $OS.FreePhysicalMemory / 1MB,
            2
          )

          $Tailscale = `
            "C:\Program Files\Tailscale\tailscale.exe"

          $IP = "Indisponivel"

          if (Test-Path $Tailscale) {
              $IP = & $Tailscale ip -4
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "              DIAGNOSTICO"
          Write-Host "=========================================="
          Write-Host ""
          Write-Host "Sistema: $($OS.Caption)"
          Write-Host "RAM total: $RAMTotal GB"
          Write-Host "RAM livre: $RAMLivre GB"
          Write-Host ""
          Write-Host "RDP: $((Get-Service TermService).Status)"
          Write-Host "Audio: $((Get-Service Audiosrv).Status)"
          Write-Host "Tailscale: $((Get-Service Tailscale).Status)"
          Write-Host "IP: $IP"
          Write-Host ""
          Write-Host "=========================================="

      # ==========================================
      # DADOS PARA CONEXAO
      # ==========================================

      - name: Mostrar dados
        shell: powershell
        run: |

          Start-Sleep -Seconds 5

          $Tailscale = `
            "C:\Program Files\Tailscale\tailscale.exe"

          $IP = & $Tailscale ip -4

          if ([string]::IsNullOrWhiteSpace($IP)) {

              Write-Error "IP do Tailscale nao encontrado."
              exit 1
          }

          $Fim = Get-Content `
            -Path "C:\ProgramData\CloudPC-EndTime.txt"

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "           CLOUD PC V4 ONLINE"
          Write-Host "=========================================="
          Write-Host ""
          Write-Host "IP Tailscale:"
          Write-Host "$IP"
          Write-Host ""
          Write-Host "Usuario:"
          Write-Host "CloudPC"
          Write-Host ""
          Write-Host "Senha:"
          Write-Host "$env:CLOUDPC_PASSWORD"
          Write-Host ""
          Write-Host "RDP: OK"
          Write-Host "Tailscale: OK"
          Write-Host "Audio: OK"
          Write-Host "Clipboard: OK"
          Write-Host "Auto Recovery: OK"
          Write-Host "Desempenho: OK"
          Write-Host ""
          Write-Host "Fim previsto:"
          Write-Host "$Fim"
          Write-Host ""
          Write-Host "Duracao: 360 minutos"
          Write-Host ""
          Write-Host "=========================================="

      # ==========================================
      # MONITOR
      # ==========================================

      - name: Monitorar PC
        shell: powershell
        run: |

          $FimTexto = Get-Content `
            -Path "C:\ProgramData\CloudPC-EndTime.txt"

          $Limite = [DateTime]::Parse($FimTexto)

          while ($true) {

              $Agora = Get-Date

              $Restante = $Limite - $Agora

              if ($Restante.TotalSeconds -le 0) {

                  Write-Host ""
                  Write-Host "=========================================="
                  Write-Host "       TEMPO MAXIMO ATINGIDO"
                  Write-Host "=========================================="

                  break
              }

              try {

                  $CPU = (
                    Get-Counter `
                      '\Processor(_Total)\% Processor Time'
                  ).CounterSamples.CookedValue

                  $CPU = [math]::Round($CPU, 1)

              }
              catch {

                  $CPU = "N/A"
              }

              try {

                  $OS = Get-CimInstance `
                    Win32_OperatingSystem

                  $TotalRAM = $OS.TotalVisibleMemorySize
                  $FreeRAM = $OS.FreePhysicalMemory

                  $RAM = 100 - (
                    ($FreeRAM / $TotalRAM) * 100
                  )

                  $RAM = [math]::Round($RAM, 1)

              }
              catch {

                  $RAM = "N/A"
              }

              $Horas = [math]::Floor(
                $Restante.TotalHours
              )

              $Minutos = $Restante.Minutes
              $Segundos = $Restante.Seconds

              Write-Host ""
              Write-Host "=========================================="
              Write-Host "$(Get-Date)"
              Write-Host "PC ONLINE"
              Write-Host "CPU: $CPU %"
              Write-Host "RAM: $RAM %"
              Write-Host "Tempo restante: ${Horas}h ${Minutos}m ${Segundos}s"
              Write-Host "=========================================="

              Start-Sleep -Seconds 60
          }
